<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Вход — Musicaa</title>
</head>
<body>
  <!-- Хедер -->
  <header class="header">
    <nav class="navigation">
      <a href="../index.html"><img class="img-nav" src="../images/logo.jpg" alt="Logo" width="70" height="50"></a>
      <ul class="catalog-items">
        <a href="../index.html"><li class="catalog-item">Главная</li></a>
        <a href="catalog.html"><li class="catalog-item">Каталог</li></a>
        <a href="product.html"><li class="catalog-item">Товары</li></a>
        <a href="order.html"><li class="catalog-item">Оформить заказ</li></a>
      </ul>
      <div class="auth-buttons">
        <a href="login.html" class="btn-login">Войти</a>
        <a href="registration.html" class="btn-signup">Регистрация</a>
      </div>
    </nav>
  </header>

  <!-- Форма входа -->
  <main class="form-page">
    <h2>Вход в <span>Musicaa</span></h2>
    
    <form class="shop-form" action="../index.html" method="post">
      
      <div class="form-row">
        <label for="login-email">Электронная почта</label>
        <input id="login-email" name="email" type="email" placeholder="example@mail.ru" required>
      </div>

      <div class="form-row">
        <label for="login-password">Пароль</label>
        <input id="login-password" name="password" type="password" required>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" name="remember">
        <span>Запомнить меня</span>
      </label>

      <button class="btn-submit" type="submit">Войти</button>
      
      <p class="form-link">
        Нет аккаунта? <a href="registration.html">Зарегистрироваться</a><br><br>
        <a href="#">Забыли пароль?</a>
      </p>
    </form>
  </main>
</body>
</html>
