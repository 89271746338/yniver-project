<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/favicon.png">

  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Каталог — Musicaa</title>
</head>
<body>

  <header class="header">
    <nav class="navigation">

      <a href="../index.html"><img class="img-nav" src="../images/logo.jpg" alt="Logo" width=150" height="100"></a>
      <ul class="catalog-items">
        <a href="../index.html"><li class="catalog-item">Главная</li></a>
        <a href="catalog.html"><li class="catalog-item">Каталог</li></a>
        <a href="product.html"><li class="catalog-item">Товары</li></a>
        <a href="order.html"><li class="catalog-item">Оформить заказ</li></a>
      </ul>
      <div class="auth-buttons">
        <a href="login.html" class="btn-login">Войти</a>
        <a href="registration.html" class="btn-signup">Регистрация</a>
      </div>
    </nav>
  </header>


  <main class="catalog-page">
    <h1 class="page-title">Каталог <span>инструментов</span></h1>
    
    <div class="cards-grid">
      

      <a href="product.html" class="card-link">
        <div class="card catalog-card">
          <img src="../images/скрипка1.jpg" alt="Скрипка" class="catalog-img">
          <h3>Скрипка Stradivarius</h3>
          <p class="price">150 000 ₽</p>
          <button class="btn-catalog">Подробнее</button>
        </div>
      </a>


      <a href="product.html" class="card-link">
        <div class="card catalog-card">
          <img src="../images/черная гитара.jpg" alt="Гитара" class="catalog-img">
          <h3>Электрогитара Fender</h3>
          <p class="price">85 000 ₽</p>
          <button class="btn-catalog">Подробнее</button>
        </div>
      </a>

      <a href="product.html" class="card-link">
        <div class="card catalog-card">
          <img src="../images/синтезатор1.jpg" alt="Синтезатор" class="catalog-img">
          <h3>Синтезатор Yamaha</h3>
          <p class="price">45 000 ₽</p>
          <button class="btn-catalog">Подробнее</button>
        </div>
      </a>


      <a href="product.html" class="card-link">
        <div class="card catalog-card">
          <img src="../images/виолончель1.jpg" alt="Виолончель" class="catalog-img">
          <h3>Виолончель ручной работы</h3>
          <p class="price">120 000 ₽</p>
          <button class="btn-catalog">Подробнее</button>
        </div>
      </a>
      
    </div>
  </main>
</body>
</html>
